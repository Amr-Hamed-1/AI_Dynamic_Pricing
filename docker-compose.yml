services:
  api:
    build: .
    image: dynamic-pricing:latest   # built once, reused by the dashboard
    entrypoint: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"   # FastAPI REST service (/docs)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dashboard:
    image: dynamic-pricing:latest   # same image; loads the model in-process
    pull_policy: never
    ports:
      - "8501:8501"   # Streamlit UI
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped